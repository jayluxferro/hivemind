name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Start PostgreSQL and create hivemind role/databases
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE hivemind LOGIN PASSWORD 'hivemind'"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE hivemind OWNER hivemind"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE hivemind_test OWNER hivemind"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
        env:
          HIVEMIND_TEST_DB_URL: postgresql://hivemind:hivemind@localhost:5432/hivemind_test

      - name: Lint
        if: matrix.python-version == '3.12'
        run: ruff check src/ tests/
