[project]
name = "hivemind-scheduler"
version = "0.1.0"
description = "OS-inspired scheduler for concurrent LLM coding agents. Transparent API proxy with admission control, rate limit awareness, AIMD backpressure, token budgets, and priority scheduling."
readme = "README.md"
license = {text = "MIT"}
authors = [
    { name = "Jay", email = "jay@sperixlabs.org" }
]
requires-python = ">=3.11"
keywords = ["llm", "agents", "scheduler", "proxy", "rate-limit", "mcp", "anthropic", "openai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Networking",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.28.0",
    "uvicorn>=0.34.0",
    "starlette>=0.45.0",
    "aiosqlite>=0.20.0",
    "rich>=13.0.0",
    "tomli>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/sperixlabs/hivemind"
Repository = "https://github.com/sperixlabs/hivemind"
Issues = "https://github.com/sperixlabs/hivemind/issues"

[project.scripts]
hivemind = "hivemind.__main__:main"
hivemind-proxy = "hivemind.proxy.server:main"
hivemind-server = "hivemind.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]
tokenizer = [
    "tiktoken>=0.7.0",
]
distributed = [
    "redis>=5.0.0",
]
all = [
    "hivemind-scheduler[tokenizer,distributed]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hivemind"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
