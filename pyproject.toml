[project]
name = "hivemind"
version = "0.1.0"
description = "OS-inspired scheduler for concurrent LLM coding agents. Local API proxy with admission control, rate limit awareness, backpressure, and token budgets."
readme = "README.md"
authors = [
    { name = "Jay", email = "jay@sperixlabs.org" }
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.28.0",
    "uvicorn>=0.34.0",
    "starlette>=0.45.0",
    "aiosqlite>=0.20.0",
    "rich>=13.0.0",
    "tomli>=2.0.0",
]

[project.scripts]
hivemind = "hivemind.__main__:main"
hivemind-proxy = "hivemind.proxy.server:main"
hivemind-server = "hivemind.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]
tokenizer = [
    "tiktoken>=0.7.0",
]
distributed = [
    "redis>=5.0.0",
]
all = [
    "hivemind[tokenizer,distributed]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 120
